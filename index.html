          display:flex; align-items:center; justify-content:center; }
  .hero h2 { color:#fff; font-size:40px; font-weight:700; text-transform:uppercase; text-align:center;
             line-height:1.25; text-shadow:0 2px 8px rgba(0,0,0,.45); padding:0 24px; }
  .side { width:50%; background:var(--panel); display:flex; flex-direction:column; align-items:center; padding:0 16px 24px; }
  .logo { height:122px; margin-top:8px; }
  h1 { color:var(--green); font-size:40px; font-weight:700; margin-top:4px; }
  .sub { font-size:15px; font-weight:600; margin-top:12px; }
  form { background:#fff; width:100%; max-width:454px; margin-top:20px; padding:40px 61px;
          border-radius:6px; box-shadow:0 4px 18px rgba(0,0,0,.12); }
  label.lbl { display:block; font-size:15px; font-weight:600; }
  label.lbl + input { margin-top:16px; }
  .pw-label { margin-top:8px; }
  input[type=text], input[type=password] { width:100%; height:38px; border:1px solid var(--border); border-radius:2px;
          padding:0 12px; font:inherit; font-size:15px; color:var(--text); background:#fff; }
  input::placeholder { color:var(--muted); }
  input:focus { outline:none; border-color:var(--green); box-shadow:0 0 0 1px var(--green); }
  .pw { position:relative; margin-top:8px; }
  .pw input { padding-right:40px; }
  .eye { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:0; cursor:pointer; color:var(--text); display:flex; }
  .row { display:flex; justify-content:space-between; align-items:center; margin-top:20px; }
  .remember { display:flex; align-items:center; gap:6px; font-size:14px; font-weight:500; }
  .remember input { accent-color:var(--green); }
  a { color:var(--green); text-decoration:none; font-weight:500; }
  a:hover { text-decoration:underline; }
  .btn { width:100%; height:40px; margin-top:12px; background:var(--green); color:#fff; border:0; border-radius:2px;
          font:inherit; font-size:15px; font-weight:600; cursor:pointer; }
  .btn:hover { opacity:.9; }
  .error { margin-top:10px; font-size:13px; color:#d93025; }
  .signup { margin-top:32px; font-size:15px; font-weight:500; }
  .signup a { font-weight:600; }
  .copy { margin-top:32px; font-size:15px; font-weight:500; color:var(--green); }
  @media (max-width:768px) {
    .page { flex-direction:column; }
    .hero, .side { width:100%; }
    .hero { min-height:260px; }
    .hero h2, h1 { font-size:30px; }
    form { padding:32px; }
  }
</style>
</head>

<script>
  const eyeOff = document.getElementById("eyeIcon").innerHTML;
  const eyeOn = '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>';
  // Demo login details (checked in the browser only).
  var USERNAME = "SCT213-C002-0113/2022", PASSWORD = "Makuer@2026", KEY = "jkuat_auth";
  // Sign in without sending the form: some viewers block form sending entirely.
  document.getElementById("loginForm").addEventListener("submit", function (e) { e.preventDefault(); signIn(); });
  document.getElementById("signInBtn").addEventListener("click", signIn);
  ["username", "password"].forEach(function (id) {
    document.getElementById(id).addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); signIn(); }
    });
  });
  function signIn() {
    var u = document.getElementById("username").value.trim();
    var p = document.getElementById("password").value;
    var err = document.getElementById("error");
    if (!u || !p) { err.textContent = "Please enter your username and password."; err.hidden = false; return; }
    if (u.toUpperCase() !== USERNAME.toUpperCase() || p !== PASSWORD) {
      err.textContent = "Incorrect username or password."; err.hidden = false; return;
    }
    // Saving the "signed in" note is optional: some viewers block it, so never let it stop sign-in.
    try {
      var store = document.getElementById("remember").checked ? window.localStorage : window.sessionStorage;
      store.setItem(KEY, "1");
    } catch (err) {}
    showPortal();

nter;padding:0 3px;line-height:1}\r\n.user{color:var(--green);font-size:14px;cursor:pointer;position:relative}\r\n.dd{position:absolute;right:0;top:26px;background:#fff;border:1px solid #ddd;border-radius:4px;min-width:130px;box-shadow:0 2px 8px rgba(0,0,0,.12)}\r\n.dd div{padding:9px 14px;color:#444;font-size:13px}.dd div:hover{background:#f2f2f2}\r\n.layout{display:flex;min-height:calc(100vh - 65px)}\r\nnav{width:190px;background:var(--green);color:#fff;flex-shrink:0;transition:margin .2s}\r\nnav.closed{margin-left:-190px}\r\nnav ul{list-style:none}\r\nnav li{padding:11px 16px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.12)}\r\nnav li:hover{background:var(--green-dark)}\r\nnav li.active{background:var(--red)}\r\nnav .sub li{background:var(--red);padding-left:26px}\r\nnav .sub li:hover{background:var(--red-dark)}\r\nnav .sub li.active{background:var(--red-dark)}\r\nnav footer{font-size:10px;padding:14px 12px;color:rgba(255,255,255,.75)}\r\nmain{flex:1;padding:22px;min-width:0}\r\n.tabs{display:flex;gap:40px;margin-bottom:18px;font-size:14px}\r\n.tabs a,.link{color:var(--green);font-weight:600;cursor:pointer}\r\n.grid{display:grid;grid-template-columns:1fr 340px;gap:20px}\r\n.card{background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:22px;margin-bottom:20px}\r\n.welcome{display:flex;justify-content:space-between;align-items:center}\r\n.welcome h2{color:var(--green);font-size:24px;margin-bottom:10px}\r\n.welcome p{font-size:13px;color:var(--muted);max-width:420px}\r\n.fee{background:var(--blue);color:#fff;text-align:center;padding:40px 20px;border-radius:6px;margin-bottom:20px;cursor:pointer}\r\n.fee h3{font-size:20px;margin:8px 0 4px}\r\n.semester{background:var(--navy);color:#fff;padding:22px;border-radius:6px}\r\n.semester h4{font-size:13px;letter-spacing:1px;margin-bottom:10px}\r\n.semester p{font-size:13px;margin-bottom:14px}\r\n.progress{background:#fff;border-radius:10px;height:14px;overflow:hidden}\r\n.progress div{background:var(--blue);height:100%;width:48%;color:#fff;font-size:10px;text-align:center;line-height:14px}\r\n.section-title{display:flex;justify-content:space-between;color:var(--green);font-weight:600;margin:6px 0 12px;font-size:15px}\r\ntable{width:100%;border-collapse:collapse;font-size:13px}\r\nth{text-align:left;padding:10px;color:#555;border-bottom:1px solid #eee}\r\ntd{padding:10px;border-bottom:1px solid #f0f0f0}\r\n.empty{text-align:center;padding:40px 0;color:var(--muted)}\r\n.empty b{display:block;margin:10px 0 6px;color:#444}\r\n.page-title{color:var(--green);font-size:22px;font-weight:600;margin-bottom:18px}\r\n.profile{display:grid;grid-template-columns:280px 1fr;background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.08)}\r\n.profile-left{padding:26px;border-right:1px solid #eee}\r\n.avatar{width:70px;height:70px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 12px}\r\n.profile-left h3{text-align:center;font-size:15px;margin-bottom:22px}\r\n.ptabs button{display:block;width:100%;text-align:left;padding:11px 14px;border:none;font-size:13px;cursor:pointer;margin-bottom:4px;background:#999;color:#fff}\r\n.ptabs button.active{background:var(--green)}\r\n.profile-right{padding:26px}\r\n.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}\r\n.field label{display:block;font-size:12px;color:#555;margin-bottom:5px}\r\n.field input,.field select{width:100%;padding:8px;border:1px solid #ccc;border-radius:3px;font-size:13px;background:#fff}\r\n.field input[readonly]{background:#e9ecef}\r\n.btn{background:var(--green);color:#fff;border:none;padding:8px 20px;font-size:13px;border-radius:3px;cursor:pointer}\r\n.btn:hover{background:var(--green-dark)}.btn.done{background:#999;cursor:default}\r\ndetails{padding:12px 16px;border-bottom:1px solid #eee;font-size:13px}summary{cursor:pointer;font-weight:600;color:#444}detail tems.<\/div>`);\r\n  el.classList.remove(\"fade\"); void el.offsetWidth; el.classList.add(\"fade\");\r\n  renderMenu(); window.scrollTo(0, 0);\r\n}\r\ndocument.addEventListener(\"click\", e => {\r\n  const t = e.target;\r\n  const g = t.closest(\"[data-go]\"), o = t.closest(\"[data-open]\");\r\n  if (o) { open = open === +o.dataset.open ? \"\" : +o.dataset.open; renderMenu(); }\r\n  else if (g) { go(g.dataset.go, g.dataset.t); if (innerWidth < 900) $(\"#nav\").classList.add(\"closed\"); }\r\n  if (t.closest(\"#burger\")) $(\"#nav\").classList.toggle(\"closed\");\r\n  if (t.closest(\"#user\")) $(\"#dd\").hidden = !$(\"#dd\").hidden; else $(\"#dd\").hidden = true;\r\n  if (t.closest(\"#logout\")) alert(\"Signed out (demo only).\");\r\n  if (t.dataset.book !== undefined) { booked = +t.dataset.book; go(\"hostel\"); }\r\n  if (t.dataset.report !== undefined) alert(\"Reporting confirmed for Semester 1 2026/2027.\");\r\n  const pb = t.closest(\"[data-ptab]\"); if (pb) { ptab = +pb.dataset.ptab; $(\"#view\").innerHTML = views.profile(); }\r\n  if (t.dataset.save !== undefined) alert(\"Profile updated successfully!\");\r\n});\r\nif (innerWidth < 900) $(\"#nav\").classList.add(\"closed\");\r\ngo(\"dashboard\");\r\n<\/script>\r\n<script>\r\n/* Log out returns to the login screen. */\r\ndocument.addEventListener(\"click\", function (e) {\r\n  if (e.target.closest && e.target.closest(\"#logout\")) {\r\n    e.stopImmediatePropagation();\r\n    try { sessionStorage.removeItem(\"jkuat_auth\"); localStorage.removeItem(\"jkuat_auth\"); } catch (err) {}\r\n    location.reload();\r\n  }\r\n}, true);\r\n<\/script>\r\n<\/body>\r\n<\/html>";
